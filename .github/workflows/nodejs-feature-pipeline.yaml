name: nodejs-feature-branch-workflow
on: 
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string
      environment:
        description: 'Environment name'
        required: true
        type: string

jobs:
  # Job name
  trigger:
    runs-on: ubuntu-latest            # Github hosted runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: List the files
        run: ls -l