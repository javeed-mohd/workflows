name: nodejs-feature-branch-workflow
on: 
  # Someone should call this
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string

env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
  account_id: "996669628469"

jobs:
  # Job name
  trigger:
    runs-on: self-hosted            # Self hosted runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      # - name: List the files
      #   run: ls -la

      - name: Read version from package.json
        id: package_version         # id is mandatory, to access the output of this step in later steps and it is unique, can be used multiple times for reference rather than using name.
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
      
      - name: Check app version
        run: echo "$APP_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        id: unit_tests
        run: npm test

      - name: Sonar scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}              # or https://sonarcloud.io

      - name: SonarQube Quality Gate check
        id: sonar_check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}              # OPTIONAL

      - name: Check Dependabot Alerts
        id: library_scan
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
          severities: 'critical,high'                            # Only check critical and high
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'                                 # Fail workflow, if alerts are found

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        id: build_image
        run: |
          docker build -t ${account_id}.dkr.ecr.us-east-1.amazonaws.com/${project}/${component}:${APP_VERSION} .
      
      - name: Trivy scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.account_id }}.dkr.ecr.us-east-1.amazonaws.com/${{ env.project }}/${{ env.component }}:${{ env.APP_VERSION }}
          scan-type: 'image'
          vuln-type: os
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Push Image
        id: push_image
        run: |
          docker push ${account_id}.dkr.ecr.us-east-1.amazonaws.com/${project}/${component}:${APP_VERSION}

      - name: Slack alert
        if: always()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ inputs.project }}/${{ inputs.component }}* feature pipeline *${{ job.status }}*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ inputs.project }}/${{ inputs.component }}* feature pipeline: *${{ job.status }}*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>*"