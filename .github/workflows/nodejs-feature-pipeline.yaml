name: nodejs-feature-branch-workflow
on: 
  # Someone should call this
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string

jobs:
  # Job name
  trigger:
    runs-on: self-hosted            # Self hosted runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      # - name: List the files
      #   run: ls -la

      - name: Read version from package.json
        id: package_version         # id is mandatory, to access the output of this step in later steps and it is unique, can be used multiple times for reference rather than using name.
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
      
      - name: Check app version
        run: echo "$APP_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        id: unit_tests
        run: npm test

      - name: Sonar scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}              # or https://sonarcloud.io

      - name: SonarQube Quality Gate check
        id: sonar_check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}              # OPTIONAL

      - name: Check Dependabot Alerts
        id: library_scan
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
          severities: 'critical,high'                            # Only check critical and high
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'                                 # Fail workflow, if alerts are found